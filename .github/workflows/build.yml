name: Build Tracka APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ إنشاء google-services.json (الحل النهائي)
      # ============================================
      - name: Create google-services.json
        run: |
          mkdir -p android/app/src/main
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" > /tmp/gservices.tmp
          base64 -d /tmp/gservices.tmp > android/app/src/main/google-services.json
          rm -f /tmp/gservices.tmp
          
          if [ -f android/app/src/main/google-services.json ]; then
            SIZE=$(stat -c%s android/app/src/main/google-services.json 2>/dev/null || stat -f%z android/app/src/main/google-services.json 2>/dev/null)
            echo "✅ google-services.json created ($SIZE bytes)"
            echo "📄 First line:"
            head -n 1 android/app/src/main/google-services.json
          else
            echo "❌ Failed to create google-services.json"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ فك تشفير Keystore
      # ============================================
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/keystore.tmp
          base64 -d /tmp/keystore.tmp > android/upload-keystore.jks
          rm -f /tmp/keystore.tmp
          
          if [ -f android/upload-keystore.jks ]; then
            SIZE=$(stat -c%s android/upload-keystore.jks 2>/dev/null || stat -f%z android/upload-keystore.jks 2>/dev/null)
            echo "✅ Keystore created ($SIZE bytes)"
          else
            echo "❌ Failed to create keystore"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ إنشاء key.properties
      # ============================================
      - name: Create key.properties
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "✅ key.properties created"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Generate App Icons
      # ============================================
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons || echo "Icons generation skipped"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Build APK
      # ============================================
      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || stat -f%z build/app/outputs/flutter-apk/app-release.apk 2>/dev/null)
            echo "✅ APK built ($SIZE bytes)"
          else
            echo "❌ APK build failed"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Build AAB
      # ============================================
      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            SIZE=$(stat -c%s build/app/outputs/bundle/release/app-release.aab 2>/dev/null || stat -f%z build/app/outputs/bundle/release/app-release.aab 2>/dev/null)
            echo "✅ AAB built ($SIZE bytes)"
          else
            echo "❌ AAB build failed"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Upload APK to Supabase
      # ============================================
      - name: Upload APK to Supabase
        if: success()
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BUILD_NUM="${{ github.run_number }}"
          APK_NAME="Tirhal-App-build-${BUILD_NUM}-${TIMESTAMP}.apk"
          
          echo "📤 Uploading APK to Supabase..."
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/apk-builds/$APK_NAME" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@pwa_to_flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          
          echo "✅ APK uploaded"
          echo "📥 ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/apk-builds/$APK_NAME"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Upload AAB to Supabase
      # ============================================
      - name: Upload AAB to Supabase
        if: success()
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BUILD_NUM="${{ github.run_number }}"
          AAB_NAME="Tirhal-App-build-${BUILD_NUM}-${TIMESTAMP}.aab"
          
          echo "📤 Uploading AAB to Supabase..."
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/apk-builds/$AAB_NAME" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@pwa_to_flutter_app/build/app/outputs/bundle/release/app-release.aab"
          
          echo "✅ AAB uploaded"
          echo "📥 ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/apk-builds/$AAB_NAME"
        working-directory: pwa_to_flutter_app