def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.pichillilorenzo.pwa_to_flutter_app"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('upload-keystore.jks')
            storePassword keystoreProperties['KEYSTORE_PASSWORD']
            keyAlias keystoreProperties['KEY_ALIAS']
            keyPassword keystoreProperties['KEY_PASSWORD']
        }
    }

    defaultConfig {
        // نصيحة: قم بتغيير الـ Application ID لاحقاً ليكون فريداً بك
        applicationId "com.pichillilorenzo.pwa_to_flutter_app"
        
        minSdkVersion 21
        targetSdkVersion 35
        
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true

        manifestPlaceholders = [
            onesignal_app_id: "c05c5d16-4e72-4d4a-b1a2-6e7e06232d98",
            onesignal_google_project_number: "REMOTE"
        ]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.6.0'
    
    // إضافة مكتبة MultiDex لضمان عدم حدوث خطأ أثناء التجميع
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ملاحظة: مكتبة OneSignal يتم جلبها تلقائياً عبر Flutter Plugin 
    // لذا لا داعي لإضافتها يدوياً هنا لتجنب التعارض (Conflict)
}

flutter {
    source '../..'
}
